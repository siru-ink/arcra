{% extends '_base.html' %}

{% block title %}Accounts List | {% endblock title %}

{% block content %}
<h2>Modify Account</h2>
<form method="post" action="/accounts/modify">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required placeholder="{{ account.name }}" />
    <br>
    <button type="submit">Create</button>
</form>
{% endblock content %}
