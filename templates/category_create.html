{% extends '_base.html' %}

{% block title %}Create Category | {% endblock title %}

{% block content %}
<h2>Create New Category</h2>
<form method="post" action="/categories/create">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" placeholder="groceries" required />
    <br />
    <label for="description">Description:</label>
    <input type="text" name="description" id="description" placeholder="grocery expense, e.g. kroger, rewe, etc." required />
    <br />
    <button type="submit">Create</button>
</form>
{% endblock content %}
