{% extends '_base.html' %}

{% block title %}Delete Category | {% endblock title %}

{% block content %}
<h2>Delete Category</h2>
<form method="post" action="/categories/delete">
    <label for="category_select">Select Category:</label>
    <select name="id" id="category_select" required >
        <option disabled selected value="" data-description="...">--Please select--</option>
        {% for category in categories %}
        <option value="{{ category.id }}" data-description="{{ category.description }}">{{ category.name }}</option>
        {% endfor %}
    </select>
    <p><b>Description:</b> <span id="category_description"></span></p>
    <button type="submit">(Attempt) Permanent Delete</button>
</form>

<script>
  (function () {
    const categorySelect = document.getElementById("category_select");
    const categoryDisplay = document.getElementById("category_description");

    function updateCategoryDisplay() {
      var description = categorySelect.options[categorySelect.selectedIndex].dataset.description;
      categoryDisplay.textContent = description;
    }

    updateCategoryDisplay();

    categorySelect.addEventListener("change", updateCategoryDisplay);
  })();
</script>
{% endblock content %}
