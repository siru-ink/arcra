{% extends '_base.html' %}

{% block title %}Accounts List | {% endblock title %}

{% block content %}
<h2>Create New Account</h2>
<form method="post" action="/accounts/create">
    <label for="name">Name:</label>
    <input type="text" name="name" id="name" required />
    <br>
    <label for="currency">Currency:</label>
    <select name="currency" id="currency" required >
        <option selected disabled value="" >--Please select--</option>
        {% for currency in currencies %}
        <option value="{{ currency.id }}">{{ currency.name }}</option>
        {% endfor %}
    </select>
    <br>
    <label for="account_type">Account Type:</label>
    <select name="account_type" id="account_type" required >
        <option selected disabled value="">--Please select--</option>
        {% for account_type in account_types %}
        <option value="{{ account_type }}">{{ account_type }}</option>
        {% endfor %}
    </select>
    <br>
    <div id="category_select">
    <label for="category">Expense Category:</label>
    <select name="category" id="category" >
        <option selected value="1" >--Please select--</option>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}</option>
        {% endfor %}
    </select>
    <br>
    </div>
    <button type="submit">Create</button>
</form>

<script>
  (function () {
    const accountSelect = document.getElementById('account_type');
    const categoryDiv = document.getElementById('category_select');

    function updateDisplay() {
      var accountType = accountSelect.value;
      if (accountType === "Expense") {
        categoryDiv.style.display = "block"
      } else {
        categoryDiv.style.display = "none"
      }
    }

    updateDisplay();

    accountSelect.addEventListener("change", updateDisplay);

  })();
</script>
{% endblock content %}
