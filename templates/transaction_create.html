{% extends '_base.html' %}

{% block title %}Record Transaction | {% endblock title %}

{% block content %}
<h2>Record Transaction</h2>
<form method="post" action="/transactions/create">
    <label for="description">Description:</label>
    <input type="text" name="description" id="description" placeholder="grocery/shopping/education..." required />
    <br />
    <label for="credit_account">Credit Account:</label>
    <span id="credit_currency"></span>
    <select name="credit_account" id="credit_account" required>
        <option value="" data-currency="..." selected disabled>--Please choose--</option>
        {% for account in accounts %}
        <option value="{{ account.id }}" data-currency="{{ account.currency }}">{{ account.name }}</option>
        {% endfor %}
    </select>
    <br />
    <label for="credit_amount">Credit Amount:</label>
    <input type="number" name="credit_amount" id="credit_amount" step="0.01" min="0" required />
    <br />
    <label for="debit_account">Debit Account:</label>
    <span id="debit_currency"></span>
    <select name="debit_account" id="debit_account" required>
        <option value="" data-currency="..." selected disabled>--Please choose--</option>
        {% for account in accounts %}
        <option value="{{ account.id }}" data-currency="{{ account.currency }}">{{ account.name }}</option>
        {% endfor %}
    </select>
    <br />
    <div id="debit_amount_group">
        <label for="debit_amount">Debit Amount:</label>
        <input type="number" name="debit_amount" id="debit_amount" step="0.01" min="0" required />
        <br />
    </div>
    <button type="submit">Record</button>
</form>

<script>
  (function () {
    const creditAccount = document.getElementById("credit_account");
    const debitAccount = document.getElementById("debit_account");
    const creditDisplay = document.getElementById("credit_currency");
    const debitDisplay = document.getElementById("debit_currency");
    const debitAmountGroup = document.getElementById("debit_amount_group");
    const debitAmountInput = document.getElementById("debit_amount");

    function getCurrency(account) {
      if (!account || account.selectedIndex < 0) {
        return "...";
      }
      return account.options[account.selectedIndex].dataset.currency;
    }

    function updateCurrencyDisplay(display, currency) {
      display.textContent = currency;
    }

    function updateAll() {
      const creditCurrency = getCurrency(creditAccount);
      const debitCurrency = getCurrency(debitAccount);

      updateCurrencyDisplay(creditDisplay, creditCurrency);
      updateCurrencyDisplay(debitDisplay, debitCurrency);

      if (creditCurrency === "..." || debitCurrency === "...") {
        debitAmountGroup.style.display = "none";
        debitAmountInput.required = true;
      } else if (creditCurrency === debitCurrency) {
        debitAmountGroup.style.display = "none";
        debitAmountInput.required = false;
      } else {
        debitAmountGroup.style.display = "block";
        debitAmountInput.required = true;
      }
    }

    updateAll();

    creditAccount.addEventListener("change", updateAll);
    debitAccount.addEventListener("change", updateAll);
  })();
</script>
{% endblock content %}
