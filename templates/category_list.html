{% extends '_base.html' %}

{% block title %}Categories List | {% endblock title %}

{% block content %}
<h2>Categories List</h2>
<ul>
    {% for category in categories %}
    <li>
        <a href="/categories/modify/{{ category.id }}">{{ category.name }}</a>
        <br />
        {{category.description}}
    </li>
    {% endfor %}
</ul>
{% endblock content %}
